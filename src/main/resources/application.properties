# This tells Spring what port to run on (8080 is the default)
server.port=8080

# --- MySQL Database Connection ---
# This is the URL for your local database. 
# We'll create the "student_system_db" database in the next step.
spring.datasource.url=jdbc:mysql://localhost:3306/student_system_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234567890

# --- Spring Data JPA (Database) Settings ---
# This tells JPA which database "dialect" to use.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# This is the magic part. 
# "update" means Spring Boot will read your Java code (the @Entity files we'll create)
# and automatically create or update your database tables for you.
spring.jpa.hibernate.ddl-auto=update
# --- JWT (JSON WEB TOKEN) SETTINGS ---
# IMPORTANT: This MUST be a long, random, and secret string. 
# Use a password generator. Do not use this example key.
jwt.secret-key=a-very-long-and-secure-secret-key-that-is-at-least-256-bits-long